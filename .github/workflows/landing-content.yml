name: Landing styles and content editors
on:
  pull_request:
permissions:
  contents: read
jobs:
  content:
    runs-on: ubuntu-latest
    env:
      BIOLYNC_UI_DIR: /tmp/biolync-content-ui
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, sqlite3, gd, zip
          tools: composer
      - run: composer install --no-interaction --prefer-dist --no-scripts
      - run: php -l app/Support/PublicSiteStyle.php && php -l app/Support/RichText.php && php -l app/Http/Controllers/PublicSiteStyleController.php && php -l app/Http/Controllers/UserController.php && php tests/landing-content.php
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/landing-content.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landing-content-ui
          path: /tmp/biolync-content-ui
