name: Profile header validation
on:
  pull_request:
  push:
    branches: [build-004-public-profile-header]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, sqlite3, gd, zip
          tools: composer
      - run: php -l app/Http/Controllers/SitePageController.php && php -l app/Support/SitePages.php && php -l app/Support/RichText.php && php -l app/Models/UserData.php && php -l app/Support/AiDiscovery.php && php -l app/Http/Controllers/AiDiscoveryController.php && php -l app/Support/SeoDiscovery.php && php -l app/Http/Controllers/SeoDiscoveryController.php && php -l app/Http/Controllers/ProfileGalleryController.php && php -l app/Support/ProfileGallery.php && php -l app/Support/HomeUi.php && php -l app/Support/PublicSiteStyle.php && php -l app/Support/ActivityMonitoring.php && php -l app/Support/ActivityAudit.php && php -l app/Models/ActivityLog.php && php -l app/Http/Middleware/AuditUserChanges.php && php -l app/Http/Controllers/PublicSiteStyleController.php && php -l app/Http/Controllers/CreatorExperienceController.php && php -l app/Http/Controllers/ActivityMonitoringController.php && php -l app/Http/Controllers/UserController.php && php -l routes/web.php && php -l app/Http/Controllers/AdminController.php && php -l database/migrations/2026_10_09_130000_create_activity_logs_table.php
      - run: composer install --no-interaction --prefer-dist --no-scripts
      - name: Test profile upload lifecycle
        run: php tests/profile-header.php && php tests/home-ui.php && php tests/photo-gallery.php && php tests/site-pages.php && php tests/ai-discovery.php && php tests/seo-discovery.php && php tests/admin-user-save.php && php tests/public-site-fonts.php && php tests/admin-rich-text.php
      - name: Compile profile Blade views and lint generated PHP
        run: |
          php -r 'require "vendor/autoload.php"; $compiler = new Illuminate\View\Compilers\BladeCompiler(new Illuminate\Filesystem\Filesystem, sys_get_temp_dir()); foreach (["resources/views/components/config/ai-discovery.blade.php", "resources/views/components/config/profile-ai-discovery.blade.php", "resources/views/components/config/featured-profile.blade.php", "resources/views/components/config/seo-discovery.blade.php", "resources/views/components/config/profile-seo-discovery.blade.php", "resources/views/components/seo/profile-head.blade.php", "resources/views/components/seo/site-head.blade.php", "resources/views/panel/edit-user.blade.php", "resources/views/components/admin-user-preview.blade.php", "resources/views/linkstack/modules/meta.blade.php", "resources/views/studio/gallery.blade.php", "resources/views/layouts/sidebar.blade.php", "resources/views/site-page.blade.php", "resources/views/panel/site.blade.php", "resources/views/components/admin-rich-text.blade.php", "resources/views/components/public-header.blade.php", "resources/views/components/config/site-pages.blade.php", "resources/views/components/config/site-page-form.blade.php", "resources/views/components/home-preview-copy.blade.php", "resources/views/studio/photo-gallery.blade.php", "resources/views/linkstack/elements/photo-gallery.blade.php", "resources/views/home.blade.php", "resources/views/demo.blade.php", "resources/views/panel/config-editor.blade.php", "resources/views/components/config/home-ui.blade.php", "resources/views/components/config/public-site-styles.blade.php", "resources/views/components/config/activity-monitoring.blade.php", "resources/views/components/public-site-styles.blade.php", "resources/views/components/save-wipe.blade.php", "resources/views/linkstack/elements/profile-header.blade.php", "resources/views/linkstack/elements/vip-status.blade.php", "resources/views/linkstack/elements/creator-experience.blade.php", "resources/views/linkstack/elements/heading.blade.php", "resources/views/studio/creator-experience.blade.php", "resources/views/studio/profile-header.blade.php", "resources/views/studio/page.blade.php", "resources/views/linkstack/linkstack.blade.php", "resources/views/linkstack/layout.blade.php", "resources/views/linkstack/modules/theme.blade.php", "resources/views/linkstack/modules/share-button.blade.php", "resources/views/studio/theme.blade.php", "resources/views/studio/theme-updater.blade.php"] as $path) { $out = tempnam(sys_get_temp_dir(), "blade"); file_put_contents($out, $compiler->compileString(file_get_contents($path))); passthru("php -l " . escapeshellarg($out), $code); unlink($out); if ($code) exit($code); }'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/profile-layout.cjs && node tests/home-layout.cjs && node tests/gallery-layout.cjs && node tests/profile-admin-ui.cjs && node tests/admin-rich-text.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-admin-ui-screenshots
          path: test-output/*.png
          retention-days: 7
  mysql-profile-metadata:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only
          MYSQL_DATABASE: biolync_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, pdo_mysql, gd, zip
          tools: composer
      - run: composer install --no-interaction --prefer-dist --no-scripts
      - run: php -l database/migrations/2026_10_03_200000_expand_profile_metadata_storage.php && php tests/profile-metadata-mysql.php
