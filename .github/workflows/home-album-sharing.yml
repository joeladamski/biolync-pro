name: Homepage album and message previews
on:
  pull_request:
permissions:
  contents: read
jobs:
  album-sharing:
    runs-on: ubuntu-latest
    env:
      ALBUM_UI_DIR: /tmp/biolync-album-ui
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, sqlite3, gd, zip
          tools: composer
      - run: composer install --no-interaction --prefer-dist --no-scripts
      - run: php -l app/Support/HomeAlbum.php && php -l app/Support/SocialPreview.php && php -l app/Http/Controllers/HomeAlbumController.php && php -l app/Http/Controllers/SocialPreviewController.php && php tests/home-album-sharing.php
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/home-album-sharing.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-album-sharing-ui
          path: /tmp/biolync-album-ui
