name: Profile home screen icons
on:
  pull_request:
permissions:
  contents: read
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, sqlite3, gd, zip
          tools: composer
      - run: composer install --no-interaction --prefer-dist --no-scripts
      - run: php -l app/Support/ProfileIcon.php && php -l app/Http/Controllers/ProfileIconController.php && php tests/profile-icons.php
