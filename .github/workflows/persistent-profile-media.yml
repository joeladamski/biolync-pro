name: Persistent profile media
on:
  pull_request:
permissions:
  contents: read
jobs:
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, sqlite3, gd, zip
          tools: composer
      - run: composer install --no-interaction --prefer-dist --no-scripts
      - run: php -l app/Support/RuntimeMedia.php && php -l app/Http/Controllers/RuntimeMediaController.php && php -l app/Console/Commands/ImportProfileMedia.php && php tests/persistent-profile-media.php
