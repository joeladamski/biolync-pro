name: Discipleship account seeding
on:
  pull_request:
permissions:
  contents: read
jobs:
  disciples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, sqlite3, gd, zip
          tools: composer
      - run: composer install --no-interaction --prefer-dist --no-scripts
      - name: Lint and exercise the account seed against Laravel and SQLite
        run: |
          php -l database/seeders/DisciplesSeeder.php
          php -l tests/disciples-seeder.php
          php tests/disciples-seeder.php
